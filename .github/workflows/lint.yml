name: Lint source files

on:
  push:
    paths:
      - "resources/source/**"
      - ".clang-format"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "resources/source/**"
      - ".clang-format"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - name: Ruff
        shell: bash
        run: |
          mapfile -d '' files < <(find resources/source -type f -name '*.py' -print0)
          if ((${#files[@]})); then ruff check "${files[@]}"; fi

  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: clang-format
        shell: bash
        run: |
          mapfile -d '' files < <(find resources/source -type f \( -name '*.c' -o -name '*.h' \) -print0)
          if ((${#files[@]})); then clang-format --style=file --dry-run --Werror "${files[@]}"; fi

  haskell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y hlint
      - name: HLint
        shell: bash
        run: |
          mapfile -d '' files < <(find resources/source -type f \( -name '*.hs' -o -name '*.lhs' \) -print0)
          if ((${#files[@]})); then hlint "${files[@]}"; fi

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Lean typecheck
        shell: bash
        run: |
          mapfile -d '' files < <(find resources/source -type f -name '*.lean' -print0)
          for file in "${files[@]}"; do lake env lean "$file"; done
