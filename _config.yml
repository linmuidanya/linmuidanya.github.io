title: Linmuidanya
description: Notes, projects, and things worth sharing.
url: https://linmuidanya.github.io
baseurl: ""
repository: linmuidanya/linmuidanya.github.io
timezone: Asia/Shanghai
markdown: kramdown
permalink: /notes/:year/:month/:day/:title/
future: true
collections:
  resource_previews:
    output: true
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - resources/posts
  - resources/documents/*.md
  - resources/source/*.md
  - resources/images/*.md
  - resources/markdown/*.md

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      type: Note
      reading_time: 5 min
---
