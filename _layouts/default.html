<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/filter.js' | relative_url }}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell nav-wrap">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Linmuidanya home">
        <span class="wordmark-mark">L</span>
        <span>linmuidanya</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="is-active"{% endif %}>Home</a>
        <a href="{{ '/notes/' | relative_url }}"{% if page.url contains '/notes' %} class="is-active"{% endif %}>Writing</a>
        <a href="{{ '/resources/' | relative_url }}"{% if page.url contains '/resources' %} class="is-active"{% endif %}>Resources</a>
        <a href="https://github.com/{{ site.repository }}" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>Built with plain files and GitHub Pages.</span>
      <span class="footer-rule" aria-hidden="true"></span>
      <span>{{ site.time | date: "%Y" }} / Linmuidanya</span>
    </div>
  </footer>
</body>
</html>
